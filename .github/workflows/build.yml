name: Build and check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build application and installer
        # Publishes, verifies the published resources and worker (test-publish.ps1 -SkipUI), then packages.
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Installer
      - name: Run checks
        shell: pwsh
        run: ./scripts/check.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MediaWorkbench-win-x64
          path: artifacts/publish/win-x64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MediaWorkbench-installer
          path: dist/
          if-no-files-found: error

  release:
    # Publishes v<Directory.Build.props version> once, from main, using the installer the checked job built.
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide whether this version needs a release
        id: version
        shell: pwsh
        run: |
          $version = ./scripts/get-version.ps1
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $null = gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>&1
          $needed = $LASTEXITCODE -ne 0
          $ErrorActionPreference = 'Stop'
          $global:LASTEXITCODE = 0
          if ($needed) { ./scripts/release-notes.ps1 -Version $version -OutputPath (Join-Path $env:RUNNER_TEMP 'notes.md') }
          "version=$version" >> $env:GITHUB_OUTPUT
          "needed=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Output ($needed ? "Releasing v$version" : "v$version is already released")
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.version.outputs.needed == 'true'
        with:
          name: MediaWorkbench-installer
          path: dist/
      - name: Publish GitHub release
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $assets = @(Get-ChildItem dist -File | Where-Object Name -like "MediaWorkbench-$version-win-x64-setup.exe*" | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw "Expected installer and checksum for $version, found $($assets.Count) files." }
          $arguments = @("v$version") + $assets + @('--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA,
            '--title', "Media Workbench $version", '--notes-file', (Join-Path $env:RUNNER_TEMP 'notes.md'))
          if ($version.Contains('-')) { $arguments += '--prerelease' } else { $arguments += '--latest' }
          gh release create @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
